# Roadrunner CI (Woodpecker + Dagger, https://cicd.apps.exowatt.com): port of .github/workflows/ci.yml — npm ci + npm test on Node 22 and Node 24 (both matrix legs, parallel steps).
# `$$` escapes `$` for Woodpecker. Docs: https://cicd.docs.exowatt.com/roadrunner/
labels:
  tier: "0"
when:
  - event: pull_request
  - event: [push, manual]
    branch: main
steps:
  - name: test-node22
    image: bash
    depends_on: []
    environment:
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://192.168.56.43:4318/v1/logs
      OTEL_EXPORTER_OTLP_LOGS_PROTOCOL: http/protobuf
    commands:
      - >-
        ci-dagger v0.10.1 npm --src=. --repo="$${CI_REPO_NAME,,}" --node=22 --scripts=test
        --npm-registry=https://npm.dev.exowatt.com/
        --dep-cache=registry.dev.exowatt.com/cache
        --dep-cache-password=file:///etc/woodpecker/zot-ci-cache --test-workers=2
  - name: test-node24
    image: bash
    depends_on: []
    environment:
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://192.168.56.43:4318/v1/logs
      OTEL_EXPORTER_OTLP_LOGS_PROTOCOL: http/protobuf
    commands:
      - >-
        ci-dagger v0.10.1 npm --src=. --repo="$${CI_REPO_NAME,,}" --node=24 --scripts=test
        --npm-registry=https://npm.dev.exowatt.com/
        --dep-cache=registry.dev.exowatt.com/cache
        --dep-cache-password=file:///etc/woodpecker/zot-ci-cache --test-workers=2
